<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-label="Replay of the self-healing test: a pod is deleted and Kubernetes recreates it while the other replica keeps serving">
<style>
.bg{fill:#0d1117}.bar{fill:#161b22}.fg{fill:#e6edf3}.mute{fill:#8b949e}.acc{fill:#3fb950}.ok{fill:#3fb950}.okb{fill:#3fb950;font-weight:700}.warn{fill:#d29922}.bad{fill:#f85149}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:16px;white-space:pre}
@media (prefers-reduced-motion: reduce){.ln{opacity:1!important}.ln animate{display:none}}
</style>
<rect class="bg" width="960" height="424" rx="10"/>
<path class="bar" d="M0 10a10 10 0 0 1 10-10h940a10 10 0 0 1 10 10v30H0z"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="480" y="25" text-anchor="middle" class="mute" style="font-size:13px">minikube · self-healing test (replay)</text>
<text class="ln" x="22" y="74" xml:space="preserve" opacity="1"><tspan class="acc">$ </tspan><tspan class="fg">kubectl get pods -l app=nginx-web</tspan><animate attributeName="opacity" calcMode="discrete" values="1;1" keyTimes="0;0.000" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="101" xml:space="preserve" opacity="0"><tspan class="mute">NAME                          READY   STATUS              AGE</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.058" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="128" xml:space="preserve" opacity="0"><tspan class="fg">nginx-web-6c8f9d7b5-4xk2p      1/1     </tspan><tspan class="ok">Running</tspan><tspan class="fg">             3d</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.058" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="155" xml:space="preserve" opacity="0"><tspan class="fg">nginx-web-6c8f9d7b5-q7m9z      1/1     </tspan><tspan class="ok">Running</tspan><tspan class="fg">             3d</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.058" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="182" xml:space="preserve" opacity="0"><tspan class="acc">$ </tspan><tspan class="fg">kubectl delete pod nginx-web-6c8f9d7b5-4xk2p</tspan><tspan class="mute">   # simulate a crash</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.167" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="209" xml:space="preserve" opacity="0"><tspan class="bad">pod &quot;nginx-web-6c8f9d7b5-4xk2p&quot; deleted</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.250" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="236" xml:space="preserve" opacity="0"><tspan class="acc">$ </tspan><tspan class="fg">kubectl get pods -l app=nginx-web -w</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.333" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="263" xml:space="preserve" opacity="0"><tspan class="fg">nginx-web-6c8f9d7b5-q7m9z      1/1     </tspan><tspan class="ok">Running</tspan><tspan class="fg">             3d</tspan><tspan class="mute">   ← still serving</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.383" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="290" xml:space="preserve" opacity="0"><tspan class="fg">nginx-web-6c8f9d7b5-h2v8n      0/1     </tspan><tspan class="warn">ContainerCreating</tspan><tspan class="fg">   1s</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.442" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="317" xml:space="preserve" opacity="0"><tspan class="fg">nginx-web-6c8f9d7b5-h2v8n      0/1     </tspan><tspan class="warn">Running</tspan><tspan class="fg">             4s</tspan><tspan class="mute">   ← readinessProbe</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.517" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="344" xml:space="preserve" opacity="0"><tspan class="fg">nginx-web-6c8f9d7b5-h2v8n      1/1     </tspan><tspan class="ok">Running</tspan><tspan class="fg">             9s</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.600" dur="12.0s" repeatCount="indefinite"/></text>
<text class="ln" x="22" y="371" xml:space="preserve" opacity="0"><tspan class="okb">✔ 2/2 replicas ready again — the Service never went down</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.683" dur="12.0s" repeatCount="indefinite"/></text>
</svg>