# ============================================================
# POLÍTICA 1: Denegar todo el tráfico por defecto
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
  labels:
    app: network-policy
    role: security
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# ============================================================
# POLÍTICA 2: Permitir tráfico entrante a Nginx
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-web
  namespace: default
  labels:
    app: network-policy
    role: security
spec:
  podSelector:
    matchLabels:
      app: nginx-web
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 80
---
# ============================================================
# POLÍTICA 3: Permitir tráfico entrante a Prometheus y Grafana
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-ingress
  namespace: default
  labels:
    app: network-policy
    role: security
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: default
  labels:
    app: network-policy
    role: security
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 3000
---
# ============================================================
# POLÍTICA 4: Permitir scraping de Prometheus hacia Nginx
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: default
  labels:
    app: network-policy
    role: security
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: nginx-web
    ports:
    - protocol: TCP
      port: 80
---
# ============================================================
# POLÍTICA 5: Permitir DNS para todos los pods
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: default
  labels:
    app: network-policy
    role: security
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
