apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
    role: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      role: monitoring
  template:
    metadata:
      labels:
        app: grafana
        role: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_SERVER_HTTP_ADDR
              value: "0.0.0.0"
          resources:
            requests:
              memory: "128Mi"
              cpu: "128m"
            limits:
              memory: "256Mi"
              cpu: "256m"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
    role: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
    role: monitoring
  ports:
    - name: web
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 32000
